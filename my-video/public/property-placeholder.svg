  <g stroke="#092219" stroke-width="15" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M1000 1430 V1180"/>
    <path d="M1000 1182 q-78 -44 -122 -20 M1000 1182 q78 -44 122 -20 M1000 1182 q-44 -78 -20 -122 M1000 1182 q44 -78 20 -122"/>
  </g>
  <g stroke="#092219" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M64 1430 V1260"/>
    <path d="M64 1262 q-58 -32 -92 -14 M64 1262 q58 -32 92 -14 M64 1262 q-32 -58 -14 -92"/>
  </g>
