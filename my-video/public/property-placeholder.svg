      <stop offset="100%" stop-color="#c2b7a2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c3226"/>
      <stop offset="100%" stop-color="#1e6249"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#sky)"/>

  <circle cx="790" cy="470" r="210" fill="#c9a227" opacity="0.16"/>
  <circle cx="790" cy="470" r="128" fill="#c9a227" opacity="0.28"/>

  <g opacity="0.07" fill="none" stroke="#f4efe6" stroke-width="2">
    <path d="M0 700 H1080 M0 780 H1080 M0 860 H1080"/>
  </g>

  <!-- villa massing, centred in the middle third of the frame -->
  <rect x="120" y="1010" width="440" height="420" fill="url(#wall)"/>
  <rect x="560" y="860" width="400" height="570" fill="url(#wall2)"/>
  <rect x="120" y="982" width="440" height="30" fill="#c9a227" opacity="0.9"/>
  <rect x="560" y="832" width="400" height="30" fill="#c9a227" opacity="0.9"/>

  <rect x="175" y="1070" width="125" height="155" fill="url(#glass)"/>
  <rect x="335" y="1070" width="125" height="155" fill="url(#glass)"/>
  <rect x="175" y="1265" width="285" height="120" fill="url(#glass)"/>
  <rect x="612" y="920" width="115" height="190" fill="url(#glass)"/>
  <rect x="765" y="920" width="115" height="190" fill="url(#glass)"/>
  <rect x="612" y="1160" width="268" height="200" fill="url(#glass)"/>

  <!-- ground -->
  <rect x="0" y="1430" width="1080" height="490" fill="#0b2b21"/>
  <rect x="0" y="1430" width="1080" height="8" fill="#c9a227" opacity="0.55"/>
